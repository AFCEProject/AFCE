# Set these to your local π0.5 Orbax checkpoints and DexJoCo LeRobot data.
pretrained_model_path: "../checkpoints/pi05_base/params"
pretrained_model_action_dim_44_path: "../checkpoints/pi05_base_action_dim_44/params"
dataset_root: "../datasets/dexjoco_lerobot_datasets"
rand_full_dataset_root: "../datasets/dexjoco_lerobot_datasets_rand_full"
ckpts_root: "../checkpoints/pi05_ckpts"
rand_full_ckpts_root: "../checkpoints/pi05_rand_full_ckpts"
# Trained DexJoCo π0.5 checkpoint used to initialize Baseline-Continue and Effect+Grounding.
effect_init_checkpoint_root: "../checkpoints/pi05_ckpts"
effect_cache_root: "../outputs/effect_vla/cache"
effect_extra_steps: 13000
effect_bootstrap_steps: 3000
effect_pilot_tasks:
  - water_plant
  - pick_bucket
  - hammer_nail
effect_init_checkpoints:
  water_plant: "../checkpoints/dexjoco_pilot3_task_balanced/pilot3_task_balanced_v2/29999/params"
  pick_bucket: "../checkpoints/dexjoco_pilot3_task_balanced/pilot3_task_balanced_v2/29999/params"
  hammer_nail: "../checkpoints/dexjoco_pilot3_task_balanced/pilot3_task_balanced_v2/29999/params"
wandb_enabled: true

batch_size: 32
single_arm_steps: 30000
dual_arm_steps: 60000
